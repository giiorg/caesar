version: '3'

vars:
  GOLANGCI_LINT_VERSION: v1.64.8
  GOFUMPT_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.1.4
  ATLAS_VERSION: v0.34.1
  SQLC_VERSION: v1.31.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.4

tasks:
  tools:
    dir: backend
    env:
      GOBIN: '{{.ROOT_DIR}}/backend/bin'
    status:
      # Version-aware: a pin bump makes these fail and reinstalls.
      - bin/golangci-lint version 2>/dev/null | grep -q {{.GOLANGCI_LINT_VERSION}}
      - bin/gofumpt --version 2>/dev/null | grep -q {{.GOFUMPT_VERSION}}
      - bin/govulncheck -version 2>/dev/null | grep -q govulncheck@{{.GOVULNCHECK_VERSION}}
      - bin/sqlc version 2>/dev/null | grep -q {{.SQLC_VERSION}}
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}

  backend:fmt:
    deps: [tools]
    dir: backend
    cmds:
      - bin/gofumpt -w .

  backend:fmt:check:
    deps: [tools]
    dir: backend
    cmds:
      - test -z "$(bin/gofumpt -l .)" || (bin/gofumpt -l . && exit 1)

  backend:vet:
    dir: backend
    cmds:
      - go vet -tags integration,property,runnerintegration,webe2e ./...

  backend:lint:
    deps: [tools]
    dir: backend
    cmds:
      - bin/golangci-lint run

  backend:vuln:
    deps: [tools]
    dir: backend
    cmds:
      - bin/govulncheck -tags integration,property,runnerintegration,webe2e ./...

  backend:build:
    dir: backend
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - go build -trimpath -ldflags "-s -w -X github.com/giiorg/caesar/backend/internal/platform/buildinfo.Version={{.VERSION}} -X github.com/giiorg/caesar/backend/internal/platform/buildinfo.Commit={{.COMMIT}} -X github.com/giiorg/caesar/backend/internal/platform/buildinfo.Date={{.DATE}}" -o bin/caesar ./cmd/caesar

  backend:test:
    dir: backend
    # Targeted runs: `task backend:test -- -run TestFoo -v` threads test flags
    # through CLI_ARGS, and `PKG=./internal/runs/ task backend:test` narrows the
    # packages. Both are needed. `-run` alone still BUILDS and starts every
    # package's test binary, so it is PKG that keeps a targeted run from paying
    # for packages it does not touch. These lanes silently discarded `--` args
    # until 2026-08-09, which is why every "targeted" run was the whole suite.
    cmds:
      - go test -race {{.CLI_ARGS}} {{.PKG | default "./..."}}

  backend:test:embedui:
    desc: "The webui tests that only exist under the embedui build tag (needs Node)"
    # backend:test runs untagged, so it never compiles the //go:embed. What it
    # DOES exercise is the whole routing contract: ui.go carries the serving
    # rules with no build tag, ui_contract_test.go runs them against a fixture
    # bundle, and MEASURED — the four mutants (drop path.Clean, serve
    # directories, drop the root-file branch, let an /assets miss fall through
    # to the SPA) each turn `go test ./internal/webui/` red with no tag set.
    #
    # What is left for THIS lane is only what needs Vite's real output: that the
    # generated index.html carries no inline <script> and that it carries the
    # build stamp — plus TestTheRealBundleSatisfiesTheRoutingContract, which
    # replays the same contract against embed.FS so the fixture is never the
    # only subject.
    #
    # deps on web:build rather than documenting an ordering, because
    # backend/internal/webui/dist is gitignored: on a clean checkout the
    # //go:embed in ui_embed.go does not compile at all, and the failure reads
    # as a broken package rather than a missing build step.
    #
    # Deliberately NOT folded into backend:ci. That lane's Node-free-ness is a
    # property ui_noembed.go's doc comment claims out loud, and it is why the
    # tagless twin exists — and CI's `backend` job has no setup-node step, so
    # folding it in would break that job outright. It is in the root `ci:`
    # aggregate instead, which has needed Node since contracts:ts.
    #
    # NO CI JOB AND NO scripts/gate INVOCATION REACHES IT. `grep -rn
    # backend:test:embedui Taskfile.yml scripts/gate .github/` returns only
    # Taskfile.yml, and scripts/gate runs four named lanes (backend:ci,
    # contracts:check, image:build, backend:test:runner) — `ci:` is not one of
    # them. So the assertions still tagged embedui are operator-run only. Same
    # for backend:static:embedui below. Both are escalated to §14 by name.
    #
    # That residual is deliberately small. MEASURED with `go test -list '.*'`:
    # 6 of the package's 9 test functions run untagged and 8 run under the tag,
    # so only 3 are embedui-only — TestTheRealBundleSatisfiesTheRoutingContract,
    # TestEmbeddedIndexIsServedAndCarriesNoInlineScript and
    # TestServedIndexCarriesTheBuildStamp. It was 9 of 10 before the routing
    # contract moved to the untagged ui.go.
    deps: [web:build]
    dir: backend
    cmds:
      - go test -race -tags embedui {{.CLI_ARGS}} {{.PKG | default "./internal/webui/"}}

  backend:static:embedui:
    desc: "vet, house lint and the analyzers over the embedui-only files (needs Node)"
    # The tagged file is invisible to every static lane, and that is MEASURED
    # rather than suspected. backend:vet, backend:lint, backend:analyze and
    # backend:vuln all run with -tags integration,property,runnerintegration and
    # never with embedui:
    #
    #   go list -f "<.GoFiles> <.IgnoredGoFiles>" ./internal/webui/
    #   -> [ui.go ui_noembed.go] [ui_embed.go ui_embed_test.go]
    #   (angle brackets stand in for go list's template braces, which a Taskfile
    #    comment can carry but which read as template syntax to a human.)
    #
    # The SAME mutant, `fmt.Printf("%d", "definitely not an int")`, planted in
    # each of the two files — this is the whole argument for ui.go existing:
    #
    #   in ui_embed.go (tagged):
    #     go vet -tags integration,property,runnerintegration ./internal/webui/ -> exit 0, silent
    #     bin/golangci-lint run ./internal/webui/...                            -> exit 0, silent
    #   in ui.go (untagged):
    #     go vet -tags integration,property,runnerintegration ./internal/webui/ -> exit 1, "wrong type string"
    #     bin/golangci-lint run ./internal/webui/...                            -> exit 1, forbidigo
    #
    # So this lane's remaining job is the //go:embed directive, the fs.Sub and
    # the three embedui-tagged assertions — not the serving rules, which the
    # untagged lanes now compile and check.
    #
    # Adding embedui to .golangci.yml's build-tags is the obvious alternative
    # and is wrong: backend/internal/webui/dist is gitignored, so //go:embed
    # does not compile on a clean checkout and `task backend:lint` would go red
    # for every developer who has not run a Node build. Scoping the tag to a
    # lane that deps on web:build is what keeps the untagged lanes Node-free.
    deps: [tools, web:build]
    dir: backend
    cmds:
      - go vet -tags embedui ./internal/webui/
      - bin/golangci-lint run --build-tags embedui ./internal/webui/...
      # The custom analyzers too: internal/arch and internal/analyzers are house
      # law, and a file no lane compiles is a file house law does not reach.
      - go build -o bin/caesar-analyze ./internal/analyzers/cmd/analyze
      - go vet -tags embedui -vettool=./bin/caesar-analyze ./internal/webui/

  backend:analyze:
    dir: backend
    cmds:
      - go build -o bin/caesar-analyze ./internal/analyzers/cmd/analyze
      - go vet -tags integration,property,runnerintegration,webe2e -vettool=./bin/caesar-analyze ./...

  backend:run:
    desc: "Run the control plane against the dev database (task db:up first)"
    dir: backend
    cmds:
      - go run ./cmd/caesar serve -config caesar.dev.json

  db:up:
    cmds:
      - docker compose -f compose.dev.yaml up -d --wait

  db:down:
    cmds:
      - docker compose -f compose.dev.yaml down

  backend:test:integration:
    dir: backend
    # See backend:test for the CLI_ARGS/PKG contract. Narrowing matters most
    # here: testdb spins a real Postgres per test process on first use, so
    # PKG=./internal/runs/ is the difference between one container and many.
    cmds:
      - go test -race -tags integration -count=1 {{.CLI_ARGS}} {{.PKG | default "./..."}}

  backend:test:runner:
    desc: "Runner integration suite (needs Docker + task image:build)"
    dir: backend
    cmds:
      # -p 1: every package in this lane spins real containers, so their test
      # binaries run one at a time. Concurrent binaries storm the daemon and
      # make timing-sensitive tests (e.g. deadline kills) flake on small hosts.
      - go test -race -tags runnerintegration -count=1 -timeout 20m -p 1 {{.CLI_ARGS}} {{.PKG | default "./internal/runs/runner/... ./internal/runs/egress/... ./internal/app/"}}

  backend:test:property:
    desc: "Property tests (rapid): pinned seed by default; RAPID_SEED=0 randomizes (nightly)"
    dir: backend
    cmds:
      - go test -race -tags property -count=1 {{.CLI_ARGS}} {{.PKG | default "./internal/workflows/ ./internal/runs/"}} -rapid.seed={{.RAPID_SEED | default "1"}} -rapid.checks={{.RAPID_CHECKS | default "100"}}

  backend:fuzz:
    desc: "Run the fuzz targets for FUZZTIME each (nightly; default 2m)"
    dir: backend
    cmds:
      - go test -run '^$' -fuzz '^FuzzParseDocument$' -fuzztime {{.FUZZTIME | default "2m"}} ./internal/workflows/

  db:new:
    desc: "Author a migration from schema.sql changes: task db:new -- add_users"
    dir: backend
    cmds:
      - atlas migrate diff {{.CLI_ARGS}} --dir "file://internal/platform/pg/migrations?format=goose" --to "file://internal/platform/pg/schema.sql" --dev-url "docker://postgres/18/dev"

  db:sqlc:
    desc: "Regenerate sqlc stores from schema.sql + queries.sql"
    deps: [tools]
    dir: backend
    cmds:
      - bin/sqlc generate

  contracts:openapi:
    desc: "Regenerate backend/api/openapi.json from the route tables"
    dir: backend
    cmds:
      - go run ./internal/contracts/cmd/openapigen -out api/openapi.json

  contracts:ts:
    desc: "Regenerate web/src/api/schema.d.ts from the OpenAPI document"
    dir: web
    cmds:
      - npm ci
      - npm run api:gen

  contracts:gen:
    desc: "Regenerate every generated contract artifact"
    cmds:
      - task: db:sqlc
      - task: contracts:openapi
      - task: contracts:ts

  contracts:check:
    desc: "Regenerate all contracts and fail on drift"
    cmds:
      - task: contracts:gen
      - git diff --exit-code -- backend/api/openapi.json web/src/api backend/internal/identity/store backend/internal/platform/audit backend/internal/assets/store backend/internal/workflows/store backend/internal/runs/store
      - test -z "$(git status --porcelain -- backend/api web/src/api)"

  # Every web lane invokes the installed binary by path. `npx` and `npm exec --`
  # both fall back to the public registry when the binary is not in
  # node_modules: `npx biome ci .` then downloads an unrelated `biome` package
  # and exits 0 having checked nothing, and `npm exec -- tsr generate` runs
  # "TypeScript Remove" instead of the router CLI. A missing install has to be a
  # hard error, not a silently vacuous pass.
  web:install:
    dir: web
    cmds:
      - npm ci

  web:lint:
    dir: web
    cmds:
      - ./node_modules/.bin/biome ci .

  web:typecheck:
    dir: web
    cmds:
      - ./node_modules/.bin/tsc --noEmit
      - node tools/check-mutants.mjs

  web:arch:
    desc: "The two constitution rules no per-file linter can express"
    dir: web
    cmds:
      # `node`, not a node_modules binary: type stripping is built into the
      # runtime. The flag is still spelled out because it is what makes the
      # lane's requirement on Node 24 explicit. main.ts imports its two modules
      # WITH the .ts extension — MEASURED: node's ESM resolver does not complete
      # an extensionless TypeScript specifier (ERR_MODULE_NOT_FOUND), which is
      # why tsconfig.json sets allowImportingTsExtensions.
      - node --experimental-strip-types tools/arch/main.ts

  web:test:
    dir: web
    cmds:
      # Runs both vitest projects: `node` (pure/transport, no DOM globals) and
      # `dom` (jsdom + the React plugin). Never npx — see the pre-flight note.
      - ./node_modules/.bin/vitest run

  web:pins:
    dir: web
    cmds:
      - node tools/check-pins.mjs

  web:routes:check:
    desc: "Regenerate routeTree.gen.ts and fail on drift"
    dir: web
    cmds:
      - ./node_modules/.bin/tsr generate
      - git diff --exit-code -- src/routeTree.gen.ts
      # git diff is blind to an untracked or already-staged path, so the drift
      # gate would be vacuous exactly when the generated tree is not committed.
      # Same companion assertion as contracts:check.
      - test -z "$(git status --porcelain -- src/routeTree.gen.ts)"

  web:build:
    dir: web
    cmds:
      - ./node_modules/.bin/vite build

  web:e2e:
    desc: "Playwright against the real backend (needs Docker for Postgres)"
    # NOT `deps: [web:build]`, unlike backend:test:embedui. This lane needs two
    # prerequisites — the built bundle AND the browser binary
    # (`./node_modules/.bin/playwright install --with-deps chromium`) — and a
    # browser download is not something a lane should trigger silently on a
    # developer's machine or in a job that never declared it. Task 14 makes both
    # visible steps in the CI workflow. Run them by hand before this target:
    #
    #   task db:up
    #   cd web && ./node_modules/.bin/playwright install --with-deps chromium
    #   cd web && ./node_modules/.bin/vite build
    #
    # A missing bundle fails at compile time (//go:embed all:dist against an
    # absent dist), and a missing browser fails inside Playwright with its own
    # install instructions — both legible, neither silent.
    dir: backend
    cmds:
      # embedui because the binary must serve the built UI; webe2e because the
      # harness is tagged so it never runs in backend:test; integration because
      # the harness reuses serve_integration_test.go's syncBuffer.
      - go test -tags "integration,webe2e,embedui" -count=1 -timeout 15m ./internal/app/ -run TestWebE2E

  secrets:
    cmds:
      - docker run --rm -u "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/repo" {{.GITLEAKS_IMAGE}} git /repo --config /repo/.gitleaks.toml --verbose

  image:build:
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} --build-arg DATE={{.DATE}} -t caesar:dev .
      - docker build --target git --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} --build-arg DATE={{.DATE}} -t caesar-git:dev .
      # The runner lane's agent. No build args: the fakecli stage depends on
      # nothing the version stamping touches.
      - docker build --target fakecli -t caesar-fakecli:dev .

  image:harness:
    desc: Build the real harness agent images (operator machine only — never CI)
    cmds:
      - docker build -t caesar-harness-claude:dev docker/harness/claude-code
      - docker build -t caesar-harness-codex:dev docker/harness/codex

  backend:ci:
    cmds:
      - task: backend:fmt:check
      - task: backend:vet
      - task: backend:lint
      - task: backend:analyze
      - task: backend:test
      - task: backend:test:property
      - task: backend:test:integration
      - task: backend:vuln
      - task: backend:build

  lint:actions:
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo" -w /repo {{.ACTIONLINT_IMAGE}} -color

  ci:
    cmds:
      - task: backend:ci
      - task: contracts:check
      # AFTER contracts:check, not before: both embedui lanes dep on web:build,
      # which needs web/node_modules, and contracts:ts is what runs `npm ci`.
      # Ordering them here means `task ci` needs nothing it did not already
      # need — this aggregate has required Node since Plan 02 added
      # contracts:ts, so the embedui lanes cost it no new dependency.
      #
      # THIS IS NOT THE WIRING THE GUARDS NEED. `task ci` is the operator's
      # local full-run; no CI job and no scripts/gate invocation reaches it
      # (.github/workflows/ci.yml runs backend:ci, image:build,
      # backend:test:runner, contracts:check, secrets and lint:actions as
      # separate jobs, and scripts/gate runs four named lanes). Putting them
      # here is strictly better than nowhere and is NOT a substitute for §14
      # naming both lanes in scripts/gate.
      - task: backend:test:embedui
      - task: backend:static:embedui
      - task: secrets
      - task: lint:actions
