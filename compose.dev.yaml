services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: caesar
      POSTGRES_PASSWORD: caesar
      POSTGRES_DB: caesar_dev
    ports:
      - "5432:5432"
    volumes:
      - caesar-dev-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caesar -d caesar_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  caesar-dev-pg:
